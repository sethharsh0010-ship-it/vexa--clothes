<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="460" height="90">
  <defs>
    <linearGradient id="vexaGoldGradLockupLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C6A15B"/>
      <stop offset="50%" stop-color="#9C7730"/>
      <stop offset="100%" stop-color="#C6A15B"/>
    </linearGradient>
    <linearGradient id="vexaGoldShineLockupLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A5618"/>
      <stop offset="50%" stop-color="#B8944B"/>
      <stop offset="100%" stop-color="#D8C18B"/>
    </linearGradient>
  </defs>

  <!-- Left Geometric Monogram -->
  <g transform="translate(10, 10) scale(0.7)">
    <polygon points="50,92 12,24 24,14 50,68" fill="url(#vexaGoldGradLockupLight)" />
    <polygon points="50,92 88,24 76,14 50,68" fill="url(#vexaGoldShineLockupLight)" />
    <polygon points="50,68 24,14 36,14 50,46" fill="url(#vexaGoldShineLockupLight)" opacity="0.95" />
    <polygon points="50,68 76,14 64,14 50,46" fill="url(#vexaGoldGradLockupLight)" opacity="0.9" />
    <polygon points="50,8 59,24 50,40 41,24" fill="url(#vexaGoldGradLockupLight)" stroke="#C6A15B" stroke-width="0.75" />
    <line x1="28" y1="36" x2="72" y2="36" stroke="url(#vexaGoldShineLockupLight)" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Vertical Divider Accent -->
  <line x1="88" y1="20" x2="88" y2="70" stroke="#C6A15B" stroke-width="1" opacity="0.4" />

  <!-- Typography: V E X A -->
  <text x="105" y="52" font-family="'Cinzel', 'Playfair Display', 'Bodoni MT', 'Didot', serif" font-size="38" font-weight="700" letter-spacing="12" fill="#111111">
    VEXA
  </text>
  
  <!-- Subtle Gold Highlight Dot on VEXA -->
  <circle cx="340" cy="46" r="3" fill="url(#vexaGoldGradLockupLight)" />

  <!-- Tagline: CLOTHING COLLECTIVE | JAIPUR -->
  <text x="106" y="70" font-family="'Montserrat', 'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" letter-spacing="5" fill="#C6A15B">
    CLOTHING COLLECTIVE <tspan fill="#A8823C">|</tspan> JAIPUR
  </text>
</svg>
