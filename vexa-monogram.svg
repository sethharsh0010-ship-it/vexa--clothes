<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="vexaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8C18B"/>
      <stop offset="35%" stop-color="#C6A15B"/>
      <stop offset="70%" stop-color="#A57F38"/>
      <stop offset="100%" stop-color="#EADBBA"/>
    </linearGradient>
    <linearGradient id="vexaGoldShine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E6924"/>
      <stop offset="50%" stop-color="#D8C18B"/>
      <stop offset="100%" stop-color="#FAF1DE"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C6A15B" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Geometric Faceted Luxury V Monogram -->
  <g filter="url(#goldGlow)">
    <!-- Outer Shield / Diamond Facets -->
    <!-- Left Wing Outer -->
    <polygon points="50,92 12,24 24,14 50,68" fill="url(#vexaGoldGrad)" />
    <!-- Right Wing Outer -->
    <polygon points="50,92 88,24 76,14 50,68" fill="url(#vexaGoldShine)" />
    
    <!-- Left Wing Inner Facet -->
    <polygon points="50,68 24,14 36,14 50,46" fill="url(#vexaGoldShine)" opacity="0.95" />
    <!-- Right Wing Inner Facet -->
    <polygon points="50,68 76,14 64,14 50,46" fill="url(#vexaGoldGrad)" opacity="0.9" />
    
    <!-- Central Diamond Apex (Jaipur Royal Crest Touch) -->
    <polygon points="50,8 59,24 50,40 41,24" fill="url(#vexaGoldGrad)" stroke="#FAF1DE" stroke-width="0.75" />
    
    <!-- Central Accent Cross Cut -->
    <line x1="28" y1="36" x2="72" y2="36" stroke="url(#vexaGoldShine)" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
